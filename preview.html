  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;novel-story-map-v2&#x27;);
      const data = JSON.parse(root.querySelector(&#x27;[data-story]&#x27;).textContent);
      const tree = root.querySelector(&#x27;[data-tree]&#x27;);
      const scopeNames = Object.fromEntries(data.scopes.map(s =&gt; [s.id, s.name]));
      const e = value =&gt; String(value ?? &#x27;&#x27;).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, c =&gt; ({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
      const validScopes = [&#x27;R&#x27;,&#x27;all&#x27;,&#x27;A&#x27;,&#x27;B&#x27;,&#x27;C&#x27;,&#x27;H&#x27;,&#x27;Q&#x27;];
      let state = {scope:&#x27;R&#x27;,expanded:[],leaves:[],families:[],boundaryOpen:[&#x27;shared&#x27;,&#x27;shen&#x27;]};
      const userToggles = new Set();
      function applySaved(saved) {
        const p = saved?.privateContent;
        if (!p || ![2,3].includes(p.version)) return;
        if (p.version === 3 &amp;&amp; validScopes.includes(p.scope)) state.scope = p.scope;
        for (const k of [&#x27;expanded&#x27;,&#x27;leaves&#x27;,&#x27;families&#x27;,&#x27;boundaryOpen&#x27;]) if(Array.isArray(p[k]))state[k] = p[k].filter(x =&gt; typeof x === &#x27;string&#x27;);
      }
      applySaved(window.openai?.widgetState);
      const range = r =&gt; `${r.file} · 第 ${r.start}${r.end === r.start ? &#x27;&#x27; : &#x27;—&#x27;+r.end} 条`;
      function sceneHTML(s, g) {
        const sources = s.refs.map(r =&gt; `&lt;div class=&quot;source-entry&quot;&gt;&lt;span&gt;${e(range(r))}&lt;/span&gt;&lt;code class=&quot;text-small&quot;&gt;${e(data.sources[r.file].name)}&lt;/code&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;消息时间 ${e(r.time)}&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
        return `&lt;li&gt;&lt;details class=&quot;scene&quot; data-leaf=&quot;${e(s.id)}&quot; ${state.leaves.includes(s.id)?&#x27;open&#x27;:&#x27;&#x27;}&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;&lt;span class=&quot;scene-title&quot;&gt;${e(s.title)}&lt;/span&gt; &lt;span class=&quot;text-small kind&quot;&gt;〔${e(s.kind)}〕&lt;/span&gt;&lt;span class=&quot;scene-ref text-small&quot;&gt;${e(s.id)} · ${e(s.refs.map(range).join(&#x27;；&#x27;))}&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;scene-detail&quot;&gt;${s.note?`&lt;div&gt;${e(s.note)}&lt;/div&gt;`:&#x27;&#x27;}${s.rewindUse?`&lt;div class=&quot;return-path&quot;&gt;回溯使用：${e(s.rewindUse)}&lt;/div&gt;`:&#x27;&#x27;}${sources}&lt;div class=&quot;text-small text-muted&quot;&gt;所属 ${e(scopeNames[g.owner] || scopeNames[g.scope])} · ${e(g.title)}&lt;/div&gt;&lt;div class=&quot;viz-row&quot;&gt;&lt;button class=&quot;btn btn-ghost&quot; type=&quot;button&quot; data-investigate=&quot;${e(s.id)}&quot;&gt;继续细拆这一段&lt;/button&gt;&lt;span class=&quot;text-small text-muted&quot; data-action-status&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;/li&gt;`;
      }
      function groupHTML(g) {
        return `&lt;details class=&quot;phase&quot; data-group=&quot;${e(g.id)}&quot; data-owner=&quot;${e(g.owner)}&quot; ${state.expanded.includes(g.id)?&#x27;open&#x27;:&#x27;&#x27;}&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;&lt;span class=&quot;phase-label&quot;&gt;&lt;span class=&quot;mark&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt; &lt;span class=&quot;text-small phase-number&quot;&gt;${e(g.id)}&lt;/span&gt; &lt;span&gt;${e(g.title)}&lt;/span&gt; &lt;span class=&quot;text-small text-muted&quot;&gt;${g.scenes.length} 个定位&lt;/span&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;phase-content&quot;&gt;&lt;div class=&quot;relation text-small&quot;&gt;${e(g.relation)}&lt;/div&gt;&lt;ol class=&quot;scene-list&quot;&gt;${g.scenes.map(s =&gt; sceneHTML(s,g)).join(&#x27;&#x27;)}&lt;/ol&gt;${g.end?`&lt;div class=&quot;return-path text-small&quot;&gt;↳ ${e(g.end)}&lt;/div&gt;`:&#x27;&#x27;}&lt;/div&gt;&lt;/details&gt;`;
      }
      function groupsFor(scope) {return data.groups.filter(g =&gt; g.scope === scope);}
      function mainSection(scope) {
        const groups = groupsFor(scope);
        return `&lt;section class=&quot;section&quot; data-owner=&quot;${scope}&quot;&gt;&lt;div class=&quot;section-title&quot;&gt;&lt;span class=&quot;mark&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;h3&gt;${e(scopeNames[scope])}&lt;/h3&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;${groups.length} 个阶段&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;branch-list&quot;&gt;${groups.map(groupHTML).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/section&gt;`;
      }
      function hypothesisSection(owner) {
        const groups = data.groups.filter(g =&gt; g.scope === &#x27;H&#x27; &amp;&amp; g.owner === owner);
        const open = state.scope === &#x27;H&#x27; || state.scope === owner || state.families.includes(owner);
        return `&lt;details class=&quot;family&quot; data-family=&quot;${owner}&quot; data-owner=&quot;${owner}&quot; ${open?&#x27;open&#x27;:&#x27;&#x27;}&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;&lt;span class=&quot;phase-label&quot;&gt;&lt;span class=&quot;mark&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt; &lt;span&gt;${e(scopeNames[owner])}派生的假设与补写&lt;/span&gt; &lt;span class=&quot;text-small text-muted&quot;&gt;${groups.length} 组&lt;/span&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;branch-list&quot;&gt;${groups.map(groupHTML).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/details&gt;`;
      }
      const boundaryRefs = refs =&gt; refs.map(ref=&gt;e(ref.replace(&#x27;:&#x27;,&#x27; 第 &#x27;).replace(&#x27;-&#x27;,&#x27;—&#x27;)+&#x27; 条&#x27;)).join(&#x27;；&#x27;);
      function boundaryHTML(){
        const b=data.boundary;
        const anchors=b.anchors.map(a=&gt;`&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;${e(a.label)}&lt;/th&gt;&lt;td&gt;${e(a.value)}&lt;div class=&quot;text-small text-muted&quot;&gt;${boundaryRefs(a.refs)}&lt;/div&gt;&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;);
        const route=b.sourceRoute.map(r=&gt;`&lt;li&gt;&lt;div class=&quot;boundary-item&quot;&gt;&lt;span&gt;&lt;strong&gt;${e(r.file)} ${e(r.range)}&lt;/strong&gt;&lt;/span&gt;&lt;code class=&quot;text-small&quot;&gt;${e(data.sources[r.file].name)}&lt;/code&gt;&lt;span&gt;${e(r.use)}&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;`).join(&#x27;&#x27;);
        const classes=b.classes.map(c=&gt;`&lt;details class=&quot;family&quot; data-boundary-class=&quot;${e(c.id)}&quot; ${state.boundaryOpen.includes(c.id)?&#x27;open&#x27;:&#x27;&#x27;}&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;${e(c.title)}&lt;span class=&quot;boundary-rule text-small&quot;&gt;${e(c.rule)}&lt;/span&gt;&lt;/summary&gt;&lt;ol class=&quot;boundary-list&quot;&gt;${c.items.map(i=&gt;`&lt;li&gt;&lt;div class=&quot;boundary-item&quot;&gt;&lt;strong&gt;${e(i.title)}&lt;/strong&gt;&lt;span&gt;${e(i.use)}&lt;/span&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;${boundaryRefs(i.refs)}&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;`).join(&#x27;&#x27;)}&lt;/ol&gt;&lt;/details&gt;`).join(&#x27;&#x27;);
        return `&lt;section class=&quot;boundary&quot;&gt;&lt;div class=&quot;boundary-part&quot;&gt;&lt;h3&gt;故事分岔：分班第一天&lt;/h3&gt;&lt;div&gt;共同前史：分班之前的经历&lt;/div&gt;&lt;div class=&quot;boundary-split&quot;&gt;&lt;div class=&quot;boundary-split-row&quot; data-owner=&quot;B&quot;&gt;&lt;div class=&quot;lane-name&quot;&gt;&lt;span class=&quot;mark&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;原许棠线&lt;/div&gt;&lt;div class=&quot;flow&quot;&gt;&lt;span&gt;新同桌 · F1 第 1629 条&lt;/span&gt;&lt;span&gt;许棠主动接近&lt;/span&gt;&lt;span&gt;冰岛／恋爱／共同生活&lt;/span&gt;&lt;span&gt;高二上接近结束&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;return-path&quot;&gt;↙ 只有沈砚川带回原线记忆；其他人的人生没有一起走过这一段&lt;/div&gt;&lt;div class=&quot;boundary-split-row&quot; data-owner=&quot;C&quot;&gt;&lt;div class=&quot;lane-name&quot;&gt;&lt;span class=&quot;mark&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;回溯线&lt;/div&gt;&lt;div class=&quot;flow&quot;&gt;&lt;span&gt;前桌 · F5 第 578 条&lt;/span&gt;&lt;span&gt;许元衡仍在班里&lt;/span&gt;&lt;span&gt;沈砚川主动追&lt;/span&gt;&lt;span&gt;重新建立关系&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;F5 第 840—842 条：回到高一下，记忆来自原许棠线高二上阶段；F6 第 192 条：分班前相同，之后分线。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;boundary-part&quot;&gt;&lt;h3&gt;文本起点与资料范围&lt;/h3&gt;&lt;table class=&quot;table table-sm&quot;&gt;&lt;tbody&gt;${anchors}&lt;/tbody&gt;&lt;/table&gt;&lt;details class=&quot;family&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;可回查的原许棠资料：F1 第 1621 条 → F5 第 577 条&lt;/summary&gt;&lt;ol class=&quot;boundary-list&quot;&gt;${route}&lt;/ol&gt;&lt;/details&gt;&lt;div class=&quot;return-path&quot;&gt;${e(b.localRoute)}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;boundary-part&quot;&gt;&lt;h3&gt;原许棠资料的四种用法&lt;/h3&gt;${classes}&lt;/div&gt;&lt;div class=&quot;boundary-part&quot;&gt;&lt;h3&gt;判定顺序&lt;/h3&gt;&lt;ol class=&quot;boundary-list&quot;&gt;${b.tests.map(t=&gt;`&lt;li&gt;&lt;div class=&quot;boundary-item&quot;&gt;&lt;strong&gt;${e(t[0])}&lt;/strong&gt;&lt;span&gt;${e(t[1])}&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;`).join(&#x27;&#x27;)}&lt;/ol&gt;&lt;/div&gt;&lt;/section&gt;`;
      }
      function render() {
        let html = &#x27;&#x27;;
        const scope = state.scope;
        root.querySelector(&#x27;[data-overview]&#x27;).hidden=scope===&#x27;R&#x27;;
        root.querySelector(&#x27;.reading-controls&#x27;).hidden=scope===&#x27;R&#x27;;
        root.querySelector(&#x27;[data-heading]&#x27;).textContent=scope===&#x27;R&#x27;?&#x27;回溯边界与资料用法&#x27;:&#x27;故事分线地图&#x27;;
        root.querySelector(&#x27;[data-counts]&#x27;).textContent=scope===&#x27;R&#x27;?&#x27;文本开线 ≠ 故事分岔；共享前史 ≠ 沈的独有记忆&#x27;:`3 条主线 · ${data.counts.hypotheses} 组独立假设／实验／补写 · ${data.counts.scenes} 个场景定位`;
        root.querySelectorAll(&#x27;[data-scope]&#x27;).forEach(b=&gt;b.setAttribute(&#x27;aria-pressed&#x27;,String(b.dataset.scope===scope)));
        if(scope===&#x27;R&#x27;){tree.innerHTML=boundaryHTML();root.querySelector(&#x27;[data-current]&#x27;).textContent=&#x27;回溯边界&#x27;;return;}
        if(scope===&#x27;C&#x27;)html+=&#x27;&lt;div class=&quot;viz-row&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; data-boundary-open&gt;查看原许棠资料的继承边界&lt;/button&gt;&lt;/div&gt;&#x27;;
        const mains = scope === &#x27;all&#x27; ? [&#x27;A&#x27;,&#x27;B&#x27;,&#x27;C&#x27;] : [&#x27;A&#x27;,&#x27;B&#x27;,&#x27;C&#x27;].includes(scope) ? [scope] : [];
        html += mains.map(mainSection).join(&#x27;&#x27;);
        if (scope !== &#x27;Q&#x27;) {
          const owners = scope === &#x27;all&#x27; || scope === &#x27;H&#x27; ? [&#x27;A&#x27;,&#x27;B&#x27;,&#x27;C&#x27;] : [scope];
          html += `&lt;section class=&quot;section&quot;&gt;&lt;div class=&quot;section-title&quot;&gt;&lt;h3&gt;独立假设、实验与补写&lt;/h3&gt;&lt;/div&gt;${owners.map(hypothesisSection).join(&#x27;&#x27;)}&lt;/section&gt;`;
        }
        if (scope === &#x27;Q&#x27;) html += mainSection(&#x27;Q&#x27;);
        if (scope === &#x27;all&#x27;) html += `&lt;details class=&quot;family&quot; data-family=&quot;Q&quot; data-owner=&quot;Q&quot; ${state.families.includes(&#x27;Q&#x27;)?&#x27;open&#x27;:&#x27;&#x27;}&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;&lt;span class=&quot;phase-label&quot;&gt;&lt;span class=&quot;mark&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span&gt;缺口、作废与关键纠正&lt;/span&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;4 组&lt;/span&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;branch-list&quot;&gt;${groupsFor(&#x27;Q&#x27;).map(groupHTML).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/details&gt;`;
        tree.innerHTML = html;
        root.querySelectorAll(&#x27;[data-scope]&#x27;).forEach(b =&gt; b.setAttribute(&#x27;aria-pressed&#x27;, String(b.dataset.scope === scope)));
        const shown = [...mains.flatMap(groupsFor), ...data.groups.filter(g =&gt; g.scope === &#x27;H&#x27; &amp;&amp; scope !== &#x27;Q&#x27; &amp;&amp; (scope === &#x27;all&#x27; || scope === &#x27;H&#x27; || g.owner === scope)), ...([&#x27;all&#x27;,&#x27;Q&#x27;].includes(scope) ? groupsFor(&#x27;Q&#x27;) : [])];
        root.querySelector(&#x27;[data-current]&#x27;).textContent = `${scope === &#x27;all&#x27; ? &#x27;三线总览&#x27; : scopeNames[scope]} · ${shown.length} 组 · ${shown.reduce((n,g)=&gt;n+g.scenes.length,0)} 个场景定位`;
      }
      function save() {
        const privateContent = {...state,version:3};
        window.openai?.setWidgetState?.({modelContent:{view:state.scope,expandedGroups:state.expanded.slice(-20)},privateContent})?.catch(()=&gt;{});
      }
      function toggleValue(key, value, open) {
        const values = new Set(state[key]);
        if(open) values.add(value); else values.delete(value);
        state[key] = [...values];
      }
      root.querySelector(&#x27;[data-scope-controls]&#x27;).addEventListener(&#x27;click&#x27;, event =&gt; {
        const button = event.target.closest(&#x27;[data-scope]&#x27;);
        if (!button) return;
        state.scope = button.dataset.scope;
        render(); save();
      });
      root.querySelector(&#x27;[data-expand]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        tree.querySelectorAll(&#x27;details.phase,details.family&#x27;).forEach(d =&gt; {
          d.open=true;
          if(d.dataset.group)toggleValue(&#x27;expanded&#x27;,d.dataset.group,true);

      root.querySelector(&#x27;[data-collapse]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {

      tree.addEventListener(&#x27;toggle&#x27;,event =&gt; {

        if(d.dataset.leaf)toggleValue(&#x27;leaves&#x27;,d.dataset.leaf,d.open);
        if(d.dataset.family)toggleValue(&#x27;families&#x27;,d.dataset.family,d.open);
        if(d.dataset.boundaryClass)toggleValue(&#x27;boundaryOpen&#x27;,d.dataset.boundaryClass,d.open);
        const key=d.dataset.group || d.dataset.leaf || d.dataset.family || d.dataset.boundaryClass;
        if(userToggles.has(key)){userToggles.delete(key);save();}
      },true);
      tree.addEventListener(&#x27;click&#x27;, async event =&gt; {
        const summary=event.target.closest(&#x27;summary&#x27;);
        if(summary){const d=summary.parentElement;userToggles.add(d.dataset.group || d.dataset.leaf || d.dataset.family || d.dataset.boundaryClass);}
        if(event.target.closest(&#x27;[data-boundary-open]&#x27;)){root.querySelector(&#x27;[data-scope=&quot;R&quot;]&#x27;).click();return;}
        const b=event.target.closest(&#x27;[data-investigate]&#x27;);
        if(!b)return;
        const g=data.groups.find(g=&gt;g.scenes.some(s=&gt;s.id===b.dataset.investigate));
        const s=g?.scenes.find(s=&gt;s.id===b.dataset.investigate);
        if(!s)return;
        const label=b.parentElement.querySelector(&#x27;[data-action-status]&#x27;);
        if(!window.openai?.sendFollowUpMessage){label.textContent=&#x27;可在聊天中引用编号 &#x27;+s.id;return;}
        const refs=s.refs.map(r=&gt;`${data.sources[r.file].name} 的第 ${r.start}—${r.end} 条消息`).join(&#x27;；&#x27;);
        try{
          await window.openai.sendFollowUpMessage({title:&#x27;继续细拆 &#x27;+s.id,prompt:`请继续细拆故事地图节点 ${s.id}「${s.title}」。所属：${scopeNames[g.owner] || scopeNames[g.scope]}；性质：${s.kind}。原文位置：${refs}。请核对完整上下文，进一步整理情节、假设和版本边界，并更新故事地图；不要续写新剧情。`});
          label.textContent=&#x27;已请求继续细拆&#x27;;
        }catch{label.textContent=&#x27;可在聊天中引用编号 &#x27;+s.id;}
      });
      window.addEventListener(&#x27;openai:set_globals&#x27;,event=&gt;{
        if(event.detail?.globals?.widgetState){applySaved(event.detail.globals.widgetState);render();}
      });
      root.querySelector(&#x27;[data-counts]&#x27;).textContent=`3 条主线 · ${data.counts.hypotheses} 组独立假设／实验／补写 · ${data.counts.scenes} 个场景定位`;
      root.querySelector(&#x27;[data-sources]&#x27;).innerHTML=Object.entries(data.sources).map(([id,s])=&gt;`&lt;div class=&quot;source-row&quot;&gt;&lt;strong&gt;${e(id)}&lt;/strong&gt;&lt;div&gt;&lt;code&gt;${e(s.name)}&lt;/code&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;${s.count} 条消息&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
      render();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (event) =&gt; {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest(&quot;[data-tooltip]&quot;);
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handlers = {
    pointerover: handlePointerOpen,
    pointerdown: handlePointer,
    pointercancel: handlePointer,
    click: handleTouchClick,
    pointerout: handleLeave,
    focusin: handleFocusIn,
    focusout: handleLeave,
    keydown: handleKeyDown,
    contextmenu: handleContextMenu,
  };
  const roots = new Map();
  const handledEvents = new WeakSet();
  const handleEvent = (event) =&gt; {
    if (handledEvents.has(event)) return;
    handledEvents.add(event);
    handlers[event.type](event);
  };
  const discoverRoots = (node) =&gt; {
    if (node.shadowRoot) listen(node.shadowRoot);
    for (const element of node.querySelectorAll(&quot;*&quot;)) {
      if (element.shadowRoot) listen(element.shadowRoot);
    }
  };
  const listen = (root) =&gt; {
    if (roots.has(root)) return;
    for (const type of Object.keys(handlers)) root.addEventListener(type, handleEvent);
    const observer = new window.MutationObserver((records) =&gt; {
      for (const { addedNodes } of records) {
        for (const node of addedNodes) {
          if (node.nodeType === Node.ELEMENT_NODE) discoverRoots(node);
        }
      }
      for (const [root, cleanup] of roots) {
        if (root.host &amp;&amp; !root.host.isConnected) {
          cleanup();
          roots.delete(root);
        }
      }
      if (activeTrigger &amp;&amp; !activeTrigger.isConnected) closeTooltip(false);
    });
    observer.observe(root, { childList: true, subtree: true });
    roots.set(root, () =&gt; {
      observer.disconnect();
      for (const type of Object.keys(handlers)) root.removeEventListener(type, handleEvent);
    });
    discoverRoots(root);
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    for (const cleanup of roots.values()) cleanup();
    roots.clear();
    tooltip = null;
  };

  // Events between children of one shadow root never reach the document.
  listen(document);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
